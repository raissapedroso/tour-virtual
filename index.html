<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/tour-virtual/vite.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tour Virtual da Unipampa</title>
  <script type="module" crossorigin src="/tour-virtual/assets/index-CsM0DivR.js"></script>
  <link rel="stylesheet" crossorigin href="/tour-virtual/assets/index-BkAWtUhs.css">
</head>
  <body>
    <div id="loading-screen">
        <div id="loading-bg">
            <img src="personagem-mario.png" alt="Mario olhando para a flor">
            <div id="loading-text">
                Aqui vamos nós! Construindo seu mundo, uma flor de cada vez...
            </div>
        </div>
    </div>
    <!-- Painel de informação (cole antes do </body>) -->
    <div id="infoPanel" aria-hidden="true" style="
      display:none;
      position:fixed;
      left:50%;
      bottom:10%;
      transform:translateX(-50%);
      width:60%;
      max-width:900px;
      max-height:40vh;
      padding:18px 20px;
      background:rgba(0,0,0,0.88);
      color:#fff;
      border-radius:12px;
      overflow:auto;
      z-index:99999;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    ">
      <!-- botão de fechar SEM onclick inline -->
      <button id="infoClose" aria-label="Fechar" style="
        position:absolute;
        top:10px;
        right:10px;
        border:0;
        background:transparent;
        color:white;
        font-size:20px;
        line-height:1;
        cursor:pointer;
        width:36px;
        height:36px;
        border-radius:50%;
      ">✕</button>

      <!-- conteúdo do texto -->
      <div id="infoText" style="
        white-space:pre-wrap;
        line-height:1.4;
        font-size:16px;
        padding-right:12px; /* para não bater no botão */
      "></div>
    </div>


    <div id="controls-container">
        <!-- O botão de orientação por dispositivo será adicionado aqui via JavaScript -->
    </div>
  </body>
</html>
